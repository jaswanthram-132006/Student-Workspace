<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 1rem;
    }

    .calculator {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: #090d16;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: right;
      margin-bottom: 20px;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .previous-operand {
      color: #94a3b8;
      font-size: 0.95rem;
      min-height: 1.2rem;
    }

    .current-operand {
      color: #f8fafc;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      outline: none;
      background: #334155;
      color: #f8fafc;
      font-size: 1.25rem;
      font-weight: 500;
      border-radius: 12px;
      height: 60px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    button:hover {
      background: #475569;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-action {
      background: #475569;
      color: #cbd5e1;
    }

    .btn-action:hover {
      background: #64748b;
    }

    .btn-operator {
      background: #3b82f6;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #2563eb;
    }

    .btn-equals {
      background: #10b981;
      color: #ffffff;
      grid-column: span 2;
    }

    .btn-equals:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </div>

    <div class="keypad">
      <button class="btn-action" data-action="clear">AC</button>
      <button class="btn-action" data-action="delete">DEL</button>
      <button class="btn-action" data-action="toggle-sign">±</button>
      <button class="btn-operator" data-operator="÷">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="btn-operator" data-operator="×">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="btn-operator" data-operator="-">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="btn-operator" data-operator="+">+</button>

      <button data-number="0">0</button>
      <button data-number=".">.</button>
      <button class="btn-equals" data-action="calculate">=</button>
    </div>
  </div>

  <script>
    class Calculator {
      constructor(previousOperandTextElement, currentOperandTextElement) {
        this.prevText = previousOperandTextElement;
        this.currText = currentOperandTextElement;
        this.clear();
      }

      clear() {
        this.currentOperand = '0';
        this.previousOperand = '';
        this.operation = undefined;
      }

      delete() {
        if (this.currentOperand === '0') return;
        if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
          this.currentOperand = '0';
        } else {
          this.currentOperand = this.currentOperand.slice(0, -1);
        }
      }

      appendNumber(number) {
        if (number === '.' && this.currentOperand.includes('.')) return;
        if (this.currentOperand === '0' && number !== '.') {
          this.currentOperand = number.toString();
        } else {
          this.currentOperand += number.toString();
        }
      }

      chooseOperation(operation) {
        if (this.currentOperand === '' && this.previousOperand === '') return;
        if (this.previousOperand !== '') {
          this.compute();
        }
        this.operation = operation;
        this.previousOperand = this.currentOperand;
        this.currentOperand = '0';
      }

      toggleSign() {
        if (this.currentOperand === '0') return;
        this.currentOperand = (parseFloat(this.currentOperand) * -1).toString();
      }

      compute() {
        let computation;
        const prev = parseFloat(this.previousOperand);
        const current = parseFloat(this.currentOperand);

        if (isNaN(prev) || isNaN(current)) return;

        switch (this.operation) {
          case '+':
            computation = prev + current;
            break;
          case '-':
            computation = prev - current;
            break;
          case '×':
            computation = prev * current;
            break;
          case '÷':
            if (current === 0) {
              alert("Cannot divide by zero");
              return;
            }
            computation = prev / current;
            break;
          default:
            return;
        }

        this.currentOperand = parseFloat(computation.toFixed(8)).toString();
        this.operation = undefined;
        this.previousOperand = '';
      }

      updateDisplay() {
        this.currText.innerText = this.currentOperand;
        if (this.operation != null) {
          this.prevText.innerText = `${this.previousOperand} ${this.operation}`;
        } else {
          this.prevText.innerText = '';
        }
      }
    }

    const prevElement = document.getElementById('previous-operand');
    const currElement = document.getElementById('current-operand');
    const calculator = new Calculator(prevElement, currElement);

    document.querySelectorAll('[data-number]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.appendNumber(button.getAttribute('data-number'));
        calculator.updateDisplay();
      });
    });

    document.querySelectorAll('[data-operator]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.chooseOperation(button.getAttribute('data-operator'));
        calculator.updateDisplay();
      });
    });

    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.getAttribute('data-action');
        if (action === 'clear') calculator.clear();
        if (action === 'delete') calculator.delete();
        if (action === 'calculate') calculator.compute();
        if (action === 'toggle-sign') calculator.toggleSign();
        calculator.updateDisplay();
      });
    });

    // Keyboard navigation support
    window.addEventListener('keydown', e => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        calculator.appendNumber(e.key);
      } else if (e.key === '+' || e.key === '-') {
        calculator.chooseOperation(e.key);
      } else if (e.key === '*') {
        calculator.chooseOperation('×');
      } else if (e.key === '/') {
        e.preventDefault();
        calculator.chooseOperation('÷');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculator.compute();
      } else if (e.key === 'Backspace') {
        calculator.delete();
      } else if (e.key === 'Escape') {
        calculator.clear();
      }
      calculator.updateDisplay();
    });
  </script>
</body>
</html>
